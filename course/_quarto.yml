# Shared Quarto config for all concept explainers.
# Render one: `make explainer C=phase1-minimal/01-lexer`  (or `quarto render <dir>/explainer.qmd`)
# Render all: `make docs`        Live preview: `make preview`
project:
  title: "swiftml — the Swift compiler, from scratch, in OCaml"
  render:
    - "**/explainer.qmd"
    - "!**/_TEMPLATE-concept/**"

format:
  html:
    theme: [cosmo, styles.scss]
    toc: true
    toc-depth: 3
    code-copy: true
    # scroll, NOT wrap: wrapping a long OCaml line destroys its indentation
    code-overflow: scroll
    highlight-style:
      light: arrow
      dark: dracula
  typst:
    toc: true
    papersize: a4
    # the PDF is mostly code: narrower margins and a smaller mono face fit ~103
    # columns (the widest line in any explainer is 105), which is what stops long
    # lines wrapping mid-expression
    margin:
      x: 1.9cm
      y: 2.2cm
    include-in-header:
      - text: |
          #show raw: set text(size: 7.6pt)
    # These explainers are dense with inline code, and justification stretches the spaces INSIDE
    # a span like `let d: Double = 3.14` until it reads as separate words. This has to go in the
    # BODY: a `#set par` in the header is overridden by Quarto's own template.
    include-before-body:
      - text: |
          #set par(justify: false)

# Cache executed code so re-renders are fast; explainers use static code blocks by default.
execute:
  freeze: auto
